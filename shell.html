<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Studio Meta Ads</title>
<meta name="description" content="Ad Studio by Brevo: product usage, recorded journeys, reference teardown and 10 Meta video ad concepts for approval.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7EF;--card:#FFFFFF;--ink:#1B1B1B;--mute:#5E625F;--line:#E6E1D4;--forest:#006A43;--mint:#C0FFA5;--mintink:#0B3D26;--red:#C8433F;--soft:#EEF5EC;--chip:#F1EEE4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1411;--card:#151D19;--ink:#ECEFEA;--mute:#A3ABA5;--line:#26302B;--forest:#3FBF85;--mint:#C0FFA5;--mintink:#0B3D26;--red:#F07A73;--soft:#16261D;--chip:#1C2621}}
:root[data-theme="dark"]{--bg:#0E1411;--card:#151D19;--ink:#ECEFEA;--mute:#A3ABA5;--line:#26302B;--forest:#3FBF85;--mint:#C0FFA5;--mintink:#0B3D26;--red:#F07A73;--soft:#16261D;--chip:#1C2621}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
a{color:var(--forest)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding-top:10px;padding-bottom:10px;font-size:14px;font-weight:600}
nav.top a{text-decoration:none;color:var(--mute)}nav.top a:hover{color:var(--forest)}
.hero{padding:56px 0 28px}
.kicker{font:500 12px/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--forest)}
h1{font-size:clamp(30px,5vw,50px);line-height:1.05;letter-spacing:-.03em;margin:12px 0 14px}
h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;margin:64px 0 10px;line-height:1.15}
h3{margin:0;font-size:21px;letter-spacing:-.01em}
h4{margin:24px 0 8px;font-size:17px}
h5{margin:0 0 4px;font:600 11px/1.2 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.lede{font-size:18px;color:var(--mute);max-width:820px}
.status{display:inline-flex;gap:8px;align-items:center;background:var(--mint);color:var(--mintink);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media (max-width:860px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card p{margin:.4em 0}
.tldr li{margin:6px 0}
.stat b{display:block;font-size:30px;letter-spacing:-.02em;color:var(--forest)}.stat span{color:var(--mute);font-size:14px}
video.wide{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:1440/900}
video.tall{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:9/16}
img{max-width:100%;display:block;border-radius:10px}
figure{margin:0}figcaption{font-size:13px;color:var(--mute);margin-top:6px}
.journey{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;align-items:start;margin:22px 0}
@media (max-width:860px){.journey{grid-template-columns:1fr}}
.journey ol{margin:6px 0 0;padding-left:20px}.journey li{margin:4px 0}
.pill{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.obs{border-left:3px solid var(--forest);padding:2px 0 2px 12px;color:var(--mute);font-size:15px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.pair .arrow{font-size:28px;color:var(--forest)}
.tbl{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font:600 11px/1.2 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
td.tc{white-space:nowrap;font:500 13px "JetBrains Mono",monospace;color:var(--forest)}
td.rt img{width:64px;border-radius:6px}
.concept{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:22px 0}
.concept.first{border:2px solid var(--forest)}
.concept header{display:flex;gap:16px;align-items:flex-start}
.cn{font:800 34px/1 Inter;color:var(--forest);min-width:48px}
.concept header>div:nth-child(2){flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--forest)}
.t-ai{background:#F3E8FF;color:#6B2BB5}.t-radar{background:#E3F0FF;color:#1D5FA8}.t-clone{background:var(--mint);color:var(--mintink)}.t-static{background:var(--chip);color:var(--mute)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-ai{background:#2B1E3D;color:#D3B5FF}:root:not([data-theme="light"]) .t-radar{background:#18283A;color:#9CC6F5}}
.fmt,.len{font-size:13px;color:var(--mute)}.len{font-weight:700}
.pick{font-size:12px;font-weight:800;background:var(--forest);color:#fff;padding:3px 10px;border-radius:999px}
.score{text-align:right;font-size:13px;color:var(--mute)}.score b{font-size:26px;color:var(--ink)}
.idea{font-size:16.5px;margin:14px 0}
.hook{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;background:var(--soft);border-radius:12px;padding:14px}
@media (max-width:760px){.hook{grid-template-columns:1fr}}
.hook p{margin:0;font-size:14.5px}.hook .big{font-weight:800;font-size:17px;line-height:1.25}
dl.prod{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14.5px;margin:12px 0}
dl.prod dt{font-weight:700;color:var(--mute)}dl.prod dd{margin:0}
@media (max-width:640px){dl.prod{grid-template-columns:1fr}dl.prod dd{margin-bottom:8px}}
.scores{display:flex;flex-wrap:wrap;gap:6px}.scores span{font-size:12px;background:var(--chip);border-radius:8px;padding:3px 8px;color:var(--mute)}.scores b{color:var(--ink)}
.callout{background:var(--mint);color:var(--mintink);border-radius:14px;padding:16px 18px;font-weight:500}
.callout a{color:var(--mintink)}
.warn{background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));border-radius:14px;padding:14px 16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{display:flex;align-items:center;gap:6px;font:500 12px "JetBrains Mono",monospace}.sw i{width:22px;height:22px;border-radius:6px;display:inline-block;border:1px solid var(--line)}
section,article{scroll-margin-top:56px}
@media (max-width:640px){.concept thead{display:none}.concept tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}.concept td{display:block;border:0;padding:2px 0}.concept td:last-child{color:var(--mute)}.concept header{flex-wrap:wrap}}
footer{margin:80px 0 40px;color:var(--mute);font-size:13px}
code{font:13px "JetBrains Mono",monospace;background:var(--chip);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
{{BODY}}
</body>
</html>
